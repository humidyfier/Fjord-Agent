apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-relay
  namespace: kubehound
  labels:
    app: ingress-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-relay
  template:
    metadata:
      labels:
        app: ingress-relay
    spec:
      serviceAccountName: relay-sa
      containers:
      - name: proxy
        image: envoyproxy/envoy:v1.22.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-relay-svc
  namespace: kubehound
spec:
  type: LoadBalancer
  selector:
    app: ingress-relay
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset-worker
  namespace: kubehound
  labels:
    app: daemonset-worker
spec:
  selector:
    matchLabels:
      app: daemonset-worker
  template:
    metadata:
      labels:
        app: daemonset-worker
    spec:
      serviceAccountName: kubehound-sa
      hostPID: true
      containers:
      - name: worker
        image: alpine:3.18
        ports:
        - containerPort: 9090
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
---
apiVersion: v1
kind: Service
metadata:
  name: daemonset-relay-svc
  namespace: kubehound
spec:
  selector:
    app: daemonset-worker
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubehound-sa
  namespace: kubehound
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-admin-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubehound-admin-binding
subjects:
- kind: ServiceAccount
  name: kubehound-sa
  namespace: kubehound
roleRef:
  kind: ClusterRole
  name: cluster-admin-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-token
  namespace: kubehound
type: Opaque
data:
  token: "YWRtaW4tdG9rZW4tc2VjcmV0"
