apiVersion: v1
kind: Namespace
metadata:
  name: fjord-t0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-proxy
  namespace: fjord-t0
  labels:
    app: ingress-proxy
    role: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-proxy
  template:
    metadata:
      labels:
        app: ingress-proxy
        role: public
    spec:
      containers:
      - name: proxy
        image: busybox:1.36
        command: ["sh", "-c", "httpd -f -p 8080 & sleep 360000"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-proxy-svc
  namespace: fjord-t0
spec:
  selector:
    app: ingress-proxy
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: fjord-t0
  labels:
    app: api-service
    role: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        role: internal
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c", "httpd -f -p 8080 & sleep 360000"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-svc
  namespace: fjord-t0
spec:
  selector:
    app: api-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crown-jewel-db
  namespace: fjord-t0
  labels:
    app: crown-jewel-db
    role: crown-jewel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crown-jewel-db
  template:
    metadata:
      labels:
        app: crown-jewel-db
        role: crown-jewel
    spec:
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh", "-c", "httpd -f -p 8080 & sleep 360000"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: crown-jewel-db-svc
  namespace: fjord-t0
spec:
  selector:
    app: crown-jewel-db
  ports:
  - port: 8080
